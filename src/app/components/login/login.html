<div class="auth-page login-bg">
  <div class="auth-inner">
    <!-- Logo -->
    <div class="logo-mark">
      <div class="logo-ring ring-1">
        <div class="logo-ring ring-2">
          <div class="logo-ring ring-3"></div>
        </div>
      </div>
    </div>

    <!-- Tarjeta -->
    <div class="auth-card">
      <h1 class="title">Bienvenido de Nuevo</h1>
      <p class="subtitle">Transforma tus ideas en realidad</p>

      <form (ngSubmit)="entrar()" class="form" autocomplete="off">
        <div class="field">
          <input
            type="email"
            name="email"
            [(ngModel)]="login.email"
            placeholder="Email"
            required
          />
        </div>

        <div class="field">
          <input
            type="password"
            name="password"
            [(ngModel)]="login.password"
            placeholder="Password"
            required
          />
        </div>

        <div class="forgot">
          <a href="javascript:void(0)">Forgot password?</a>
        </div>

        <button type="submit" class="primary-btn">
          SIGN IN
        </button>

        <div class="bottom-link">
          <span>No tienes cuenta? </span>
          <button type="button" class="link-btn" (click)="goRegister()">
            Regístrate aquí
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
